[project]
name = "voce-eval"
version = "0.1.0"
description = "Evaluation harness for the Voce speaker-gate filter"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "soundfile>=0.12",
    "requests>=2.31",
    "tqdm>=4.66",
    "textgrid>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
