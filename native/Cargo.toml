[package]
name = "voce-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C ABI shim for Voce speaker-gate inference"

[lib]
name = "voce_native"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
serde_json = "1"

[[bin]]
name = "voce-native-probe"
path = "src/bin/probe.rs"
